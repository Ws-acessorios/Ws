name: Actualizar catálogo

on:
  workflow_dispatch:
    inputs:
      catalog_json:
        description: "Conteúdo completo do catalogo.json gerado na área /gestao"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Validar e guardar catalogo.json
        env:
          CATALOG_JSON: ${{ inputs.catalog_json }}
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ["CATALOG_JSON"]
          catalog = json.loads(raw)
          if catalog.get("version") != 1:
              raise SystemExit("catalogo.json deve usar version 1")
          if not isinstance(catalog.get("collections"), list) or not isinstance(catalog.get("products"), list):
              raise SystemExit("collections e products devem ser listas")
          with open("catalogo.json", "w", encoding="utf-8") as handle:
              json.dump(catalog, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Guardar alteração no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git diff --cached --quiet && echo "Sem alterações" || git commit -m "Actualizar catálogo"
          git push
